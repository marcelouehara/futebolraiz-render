name: render

on:
  repository_dispatch:
    types: [render]

permissions:
  contents: write

concurrency:
  group: render
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Dependencias
        # A rede do runner as vezes falha: cada tentativa tem limite de tempo e repete ate 4 vezes
        timeout-minutes: 15
        run: |
          for i in 1 2; do
            timeout 120 sudo apt-get update -qq || true
            if timeout 240 sudo apt-get install -y -qq ffmpeg fonts-dejavu-core > /dev/null; then break; fi
            echo "apt falhou (tentativa $i)"; sleep 15
          done
          # Plano B: ffmpeg estatico baixado do proprio GitHub, se o apt nao conseguiu
          if ! command -v ffmpeg; then
            curl -sL --retry 5 --max-time 300 -o /tmp/ff.tar.xz https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-linux64-gpl.tar.xz
            mkdir -p /tmp/ff && tar -xf /tmp/ff.tar.xz -C /tmp/ff --strip-components=1
            echo "/tmp/ff/bin" >> "$GITHUB_PATH"; export PATH="/tmp/ff/bin:$PATH"
          fi
          command -v ffmpeg
          for i in 1 2 3; do timeout 300 pip install -q --retries 5 --timeout 30 edge-tts faster-whisper && break; sleep 15; done

      - name: Renderizar
        env:
          JOB: ${{ toJson(github.event.client_payload) }}
          FISH_API_KEY: ${{ secrets.FISH_API_KEY }}
        run: python3 render.py

      # Branch "videos" sem historico: guarda so os 5 videos mais recentes (o Buffer baixa logo apos publicar)
      - name: Publicar no branch videos
        env:
          GH_TOKEN: ${{ github.token }}
          JOB: ${{ toJson(github.event.client_payload) }}
        run: |
          mkdir -p /tmp/pub
          if git fetch -q origin videos; then git archive FETCH_HEAD | tar -x -C /tmp/pub; fi
          cp out/*.mp4 out/*.json /tmp/pub/
          # historico.csv: 1 linha por video, e a memoria de temas que o n8n le antes de escolher o fato
          python3 historico.py /tmp/pub/historico.csv
          cd /tmp/pub
          ls *.mp4 | sort | head -n -5 | sed 's/\.mp4$//' | while read id; do rm -f "$id.mp4" "$id.json"; done
          git init -q -b videos
          git config user.name "futebolraiz-render"
          git config user.email "actions@github.com"
          git add -A
          git commit -q -m "videos $(date -u +%FT%TZ)"
          git push -q -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" videos
